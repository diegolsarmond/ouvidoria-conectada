server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Corrige requisições duplicadas de prefixo /ouvidoria/ouvidoria
    rewrite ^/ouvidoria/ouvidoria(/.*)?$ /ouvidoria$1 last;

    # Compressão gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Cache de arquivos estáticos na pasta assets (independente de prefixos)
    location ~* /assets/(.+)$ {
        root /usr/share/nginx/html/ouvidoria;
        try_files /assets/$1 =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache de outros arquivos estáticos da raiz do build (ícones, imagens, robots)
    location ~* /([^/]+\.(?:ico|png|svg|txt))$ {
        root /usr/share/nginx/html/ouvidoria;
        try_files /$1 =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy para API interno (com e sem prefixo ouvidoria)
    location ^~ /ouvidoria/api/ {
        proxy_pass http://192.168.30.9:3002/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ^~ /api/ {
        proxy_pass http://192.168.30.9:3002/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Arquivos estáticos e SPA fallback para /ouvidoria/
    location ^~ /ouvidoria/ {
        root /usr/share/nginx/html;
        try_files $uri /ouvidoria/index.html;
    }

    # Fallback para quando o proxy externo remove o prefixo /ouvidoria/
    location / {
        root /usr/share/nginx/html;
        try_files /ouvidoria$uri /ouvidoria/index.html;
    }
}
